<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customer Feedback Kiosk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #0f172a;
      margin-bottom: 12px;
    }
    p.subtitle {
      font-size: 1.2rem;
      color: #64748b;
      margin-bottom: 48px;
    }
    .emoji-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 900px;
    }
    .emoji-btn {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px 16px;
      width: 140px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .emoji-btn:active {
      transform: scale(0.92);
      border-color: #3b82f6;
    }
    .emoji-icon {
      font-size: 3.8rem;
    }
    .emoji-label {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
    }
    /* Notifikasi Terima Kasih */
    #thank-you {
      display: none;
      background: white;
      padding: 48px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }
    #thank-you h2 {
      font-size: 2.2rem;
      color: #16a34a;
      margin-bottom: 12px;
    }
    #thank-you p {
      font-size: 1.2rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <!-- Layar Pertanyaan -->
  <div id="survey-box">
    <h1>Bagaimana pengalaman makan Anda?</h1>
    <p class="subtitle">Sentuh salah satu emotikon di bawah untuk menilai</p>

    <div class="emoji-grid">
      <button class="emoji-btn" onclick="sendRating('Sangat Kecewa')">
        <span class="emoji-icon">😡</span>
        <span class="emoji-label">Kecewa</span>
      </button>

      <button class="emoji-btn" onclick="sendRating('Kurang Puas')">
        <span class="emoji-icon">🙁</span>
        <span class="emoji-label">Kurang</span>
      </button>

      <button class="emoji-btn" onclick="sendRating('Cukup / Biasa')">
        <span class="emoji-icon">😐</span>
        <span class="emoji-label">Biasa Aja</span>
      </button>

      <button class="emoji-btn" onclick="sendRating('Puas')">
        <span class="emoji-icon">🙂</span>
        <span class="emoji-label">Enak & Puas</span>
      </button>

      <button class="emoji-btn" onclick="sendRating('Luar Biasa')">
        <span class="emoji-icon">😍</span>
        <span class="emoji-label">Luar Biasa!</span>
      </button>
    </div>
  </div>

  <!-- Layar Apresiasi (Otomatis Reset) -->
  <div id="thank-you">
    <h2>Terima Kasih! 🙏</h2>
    <p>Masukan Anda sangat berarti untuk kemajuan rasa dan layanan kami.</p>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCaa3CZUdAD7kkYUM4pVad8ZIlNvQ4YwSt-tE9YzqmaW_vaFbMVaKSRP9H7ZrshYDt/exec";

    function sendRating(ratingText) {
      // 1. Tampilkan layar Terima Kasih langsung tanpa delay
      document.getElementById("survey-box").style.display = "none";
      document.getElementById("thank-you").style.display = "block";

      // 2. Kirim data ke Google Sheets di latar belakang
     // fetch(SCRIPT_URL, {
      //  method: "POST",
       // mode: "no-cors",
      //  headers: { "Content-Type": "application/json" },
      //  body: JSON.stringify({ rating: ratingText })
    //  }).catch(err => console.error("Gagal mencatat:", err));


fetch(SCRIPT_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({ rating: ratingText })
})
  .then(res => res.json())
  .then(data => console.log("Berhasil:", data))
  .catch(err => console.error("Gagal mencatat:", err));
      

      // 3. Reset kembali ke tampilan awal dalam 2.5 detik
      setTimeout(() => {
        document.getElementById("thank-you").style.display = "none";
        document.getElementById("survey-box").style.display = "block";
      }, 2500);
    }
  </script>
</body>
</html>
